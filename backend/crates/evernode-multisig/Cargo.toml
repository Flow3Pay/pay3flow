[package]
name = "evernode-multisig"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Everscale OTC and multisig wallet workflows in Rust"
license = "GPL-3.0-only"
publish = false
autobins = false

[[bin]]
name = "evernode-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bip32 = { version = "0.5", default-features = false, features = ["std", "secp256k1"] }
bip39 = { version = "2", features = ["rand", "zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
hex = "0.4"
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
zeroize = { version = "1", features = ["derive"] }
