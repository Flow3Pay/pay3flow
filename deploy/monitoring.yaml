apiVersion: v1
kind: Namespace
metadata:
  name: pay3flow-monitoring
  labels:
    app.kubernetes.io/part-of: pay3flow
    app.kubernetes.io/component: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pay3flow-prometheus-config
  namespace: pay3flow-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: pay3flow-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - pay3flow-backend.pay3flow.svc.cluster.local:8080
            labels:
              service: backend
              namespace: pay3flow

      - job_name: pay3flow-frontend
        metrics_path: /frontend-metrics
        static_configs:
          - targets:
              - pay3flow-frontend.pay3flow.svc.cluster.local:3000
            labels:
              service: frontend
              namespace: pay3flow

      - job_name: pay3flow-postgres
        scrape_interval: 30s
        scrape_timeout: 25s
        static_configs:
          - targets:
              - pay3flow-postgres-exporter.pay3flow-monitoring.svc.cluster.local:9187
            labels:
              service: postgres
              namespace: pay3flow

      - job_name: pay3flow-redis
        scrape_interval: 30s
        scrape_timeout: 25s
        static_configs:
          - targets:
              - pay3flow-redis-exporter.pay3flow-monitoring.svc.cluster.local:9121
            labels:
              service: redis
              namespace: pay3flow

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pay3flow-prometheus-data
  namespace: pay3flow-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pay3flow-prometheus
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-prometheus
spec:
  selector:
    app.kubernetes.io/name: pay3flow-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay3flow-prometheus
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pay3flow-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pay3flow-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: pay3flow-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: pay3flow-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: pay3flow-postgres-exporter
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: pay3flow-postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay3flow-postgres-exporter
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pay3flow-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pay3flow-postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: pay3flow-postgres-exporter
                  key: DATA_SOURCE_NAME
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pay3flow-redis-exporter
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-redis-exporter
spec:
  selector:
    app.kubernetes.io/name: pay3flow-redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay3flow-redis-exporter
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pay3flow-redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pay3flow-redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          env:
            - name: REDIS_ADDR
              value: redis://pay3flow-redis.pay3flow.svc.cluster.local:6379
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pay3flow-grafana-provisioning
  namespace: pay3flow-monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Pay3Flow Prometheus
        uid: pay3flow-prometheus
        type: prometheus
        access: proxy
        url: http://pay3flow-prometheus.pay3flow-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Pay3Flow
        orgId: 1
        folder: Pay3Flow
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pay3flow-grafana-dashboard
  namespace: pay3flow-monitoring
data:
  pay3flow-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "DOWN"}, "1": {"text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "pay3flow_up{service=\"backend\"}", "refId": "A"}],
          "title": "Pay3Flow backend",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 6, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "rate(pay3flow_http_requests_total[5m])", "legendFormat": "requests/s", "refId": "A"}],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 15, "y": 0},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "rate(pay3flow_http_request_duration_seconds_total[5m]) / clamp_min(rate(pay3flow_http_requests_total[5m]), 0.001)", "legendFormat": "average latency", "refId": "A"}],
          "title": "Average HTTP latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 0, "y": 5},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum(rate(pay3flow_http_responses_total{status_class=~\"4xx|5xx\"}[5m])) by (status_class)", "legendFormat": "{{status_class}}", "refId": "A"}],
          "title": "HTTP error rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 9, "y": 5},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "up{job=~\"pay3flow-backend|pay3flow-frontend|pay3flow-postgres|pay3flow-redis\"}", "legendFormat": "{{job}}", "refId": "A"}],
          "title": "Scrape targets",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 5},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "pay3flow_http_requests_in_flight", "refId": "A"}],
          "title": "Requests in flight",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "pay3flow-prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "DOWN"}, "1": {"text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 10},
          "id": 7,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "pay3flow_up{service=\"frontend\"}", "refId": "A"}],
          "title": "Pay3Flow frontend",
          "type": "stat"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["pay3flow", "backend", "postgres", "redis"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Pay3Flow overview",
      "uid": "pay3flow-overview",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pay3flow-grafana-data
  namespace: pay3flow-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pay3flow-grafana
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pay3flow-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay3flow-grafana
  namespace: pay3flow-monitoring
  labels:
    app.kubernetes.io/name: pay3flow-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pay3flow-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pay3flow-grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://pay3flow.lefine.pro/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: pay3flow-grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pay3flow-grafana-admin
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
              subPath: dashboard-provider.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pay3flow-grafana-data
        - name: provisioning
          configMap:
            name: pay3flow-grafana-provisioning
        - name: dashboards
          configMap:
            name: pay3flow-grafana-dashboard
