<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Live cross-border payment routing" />
    <meta name="theme-color" content="#f4f4f3" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/icons/assets/pay3flow_logo.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      const root = document.documentElement;
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");
      let savedTheme;
      try {
        savedTheme = localStorage.getItem("pay3flow-theme");
        const savedLocale = localStorage.getItem("pay3flow-locale");
        if (savedLocale === "en" || savedLocale === "ru" || savedLocale === "hy") root.lang = savedLocale;
      } catch (_) {}
      if (savedTheme === "light" || savedTheme === "dark") root.dataset.themeManual = "true";
      root.dataset.theme = root.dataset.themeManual ? savedTheme : systemTheme.matches ? "dark" : "light";
      systemTheme.addEventListener("change", (event) => {
        if (!root.dataset.themeManual) root.dataset.theme = event.matches ? "dark" : "light";
      });
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
