services:
  postgres:
    image: postgres:16-alpine
    container_name: pay3flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pay3flow
      POSTGRES_PASSWORD: pay3flow
      POSTGRES_DB: pay3flow
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay3flow -d pay3flow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pay3flow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pay3flow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://pay3flow:pay3flow@postgres:5432/pay3flow
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      AP_ORIGIN: http://backend:8080
      AP_HANDLE: pay3flow
      AP_KEY_PATH: /app/data/ap-key.pem
      AP_REQUIRE_SIGNATURES: "false"
      FMATCH_INBOX: http://fmatch:7277/inbox/actra
      FMATCH_ACTOR_ID: http://fmatch:7277/actor/actra
      SECRETS_KEY: ${SECRETS_KEY:-dev-secrets-key-change-me}
      SERVICE_FEE_PERCENT: 0.7
      FX_SOURCE: mock
      FX_MARGIN_PERCENT: 1.0
      CRW_GRPC_URL: http://crw:3031
      DISCOVERY_INTERVAL_SECS: "1500"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      REDIS_URL: redis://redis:6379
      PAIRS_CACHE_TTL_SECS: "300"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fmatch-postgres:
    image: postgres:16-alpine
    container_name: pay3flow-fmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: OrderQue2026Pass
      POSTGRES_DB: orderque
    ports:
      - "5433:5432"
    volumes:
      - fmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderque"]
      interval: 5s
      timeout: 3s
      retries: 5

  fmatch-typesense:
    image: typesense/typesense:0.25.1
    container_name: pay3flow-fmatch-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: development
    volumes:
      - fmatch_tsdata:/data
    command: --data-dir=/data --api-key=development --port=8108

  fmatch:
    build: ./fmatch
    container_name: pay3flow-fmatch
    restart: unless-stopped
    ports:
      - "7277:7277"
    environment:
      RUST_LOG: info
      POSTGRES_DNS: postgres://postgres:OrderQue2026Pass@fmatch-postgres:5432/orderque
      TYPESENSE_HOST: http://fmatch-typesense:8108
      TYPESENSE_API_KEY: development
      ACTOR_DOMAIN: localhost:7277
      ACTIVITYPUB_REQUIRE_SIGNATURES: "false"
      FMATCH_CANDIDATE_RESULT_INBOX_URL: http://backend:8080/inbox
    volumes:
      - ./fmatch/data:/app/data
    depends_on:
      fmatch-postgres:
        condition: service_healthy
      fmatch-typesense:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: pay3flow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

  crw:
    build: ./crw
    container_name: pay3flow-crw
    restart: unless-stopped
    ports:
      - "3030:3030"
      - "3031:3031"
    environment:
      RUST_LOG: info
      CRW_SERVER__HOST: 0.0.0.0
      CRW_SERVER__PORT: "3030"
      CRW_GRPC_PORT: "3031"
      CRW_RENDERER__MODE: none
      CRW_SEARCH__SEARXNG_URL: http://searcher:8080
      ACQUIRER_DB_DSN: postgres://pay3flow:pay3flow@postgres:5432/pay3flow
    depends_on:
      searcher:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  searcher:
    image: docker.io/searxng/searxng:latest
    container_name: pay3flow-searcher
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
  backend_data:
  redisdata:
  fmatch_pgdata:
  fmatch_tsdata:
  fmatch_data:
