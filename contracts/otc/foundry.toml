[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@safe-global/=node_modules/@safe-global/", "@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 256
