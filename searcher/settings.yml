use_default_settings: general

general:
  debug: false
  instance_name: "Pay3Flow Searcher"

server:
  secret_key: "CHANGE_ME_before_production"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8081/"
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - json

ui:
  static_use_hash: true

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: ya
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false