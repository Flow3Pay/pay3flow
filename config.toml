# Non-secret Pay3Flow runtime configuration.
#
# Credentials and connection strings that may contain credentials remain
# environment-only: DATABASE_URL, REDIS_URL, JWT_SECRET, SECRETS_KEY,
# ADMIN_TOKEN, NEAR_INTENTS_JWT, and SYMBIOSIS_PARTNER_ID.

log_filter = "info"
http_addr = "0.0.0.0:8080"

ap_origin = "http://localhost:8080"
ap_handle = "pay3flow"
ap_key_path = "./data/ap-key.pem"
ap_require_signatures = false
fmatch_inbox = "http://localhost:7277/inbox/actra"
fmatch_actor_id = "http://localhost:7277/actor/actra"

service_fee_percent = 0.7
fx_source = "mock"
fx_url = "https://api.frankfurter.app/latest"
fx_cache_ttl_secs = 300
fx_margin_percent = 1.0
pairs_cache_ttl_secs = 300

p2p_search_enabled = true
p2p_search_timeout_ms = 4000
p2p_search_cache_ttl_ms = 5000
# Maximum age of a PostgreSQL Fmatch answer used when Lefine is unavailable.
p2p_fmatch_stale_secs = 900
p2p_search_assets = []
# Optional local browser workflow settings.
# playwright_chromium_executable = "/usr/bin/chromium"
# p2p_workflow_debug_screenshot = "/tmp/pay3flow-workflow-failure.png"

near_intents_url = "https://1click.chaindefuser.com"
# Set these only to public, valid addresses when enabling live dry quotes.
# near_intents_quote_recipient = "..."
# near_intents_quote_refund_to = "..."
near_intents_refresh_secs = 300

route_max_depth = 4
route_source_fiats = ["AMD", "RUB"]
route_p2p_assets = ["USDT", "USDC", "XRP"]
route_intent_assets = ["USDT@tron", "USDT@avalanche-c", "USDT@solana", "USDC@solana", "XRP@xrpl"]
route_withdrawals = []

# Optional CoW Protocol same-chain quote adapter. Each endpoint is
# "chain=url" and each token is "chain:SYMBOL=address". CoW does not bridge
# assets between chains; cross-chain routes use a configured bridge provider.
cow_api_urls = ["ethereum=https://api.cow.fi/mainnet"]
cow_tokens = [
  "ethereum:USDT=0xdAC17F958D2ee523a2206206994597C13D831ec7",
  "ethereum:USDC=0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48",
  "ethereum:ETH=0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2",
]
# Read-only quote address. Execution must use the user's wallet address.
cow_quote_address = "0x0000000000000000000000000000000000000001"

# Optional Symbiosis cross-chain quote provider. The partner id remains
# environment-only when a partner-specific API credential is required.
symbiosis_url = "https://api.symbiosis.finance/crosschain"
symbiosis_quote_address = "0x0000000000000000000000000000000000000001"
symbiosis_slippage_bps = 300
# Audited `chain_id=MetaRouter,MetaRouterGateway` pairs from the official
# Symbiosis mainnet SDK configuration. Update them together with that source.
symbiosis_execution_contracts = [
  "1=0xf621Fb08BBE51aF70e7E0F4EA63496894166Ff7F,0xfCEF2Fe72413b65d3F393d278A714caD87512bcd",
  "56=0x44487a445a7595446309464A82244B4bD4e325D5,0x5c97D726bf5130AE15408cE32bc764e458320D2f",
  "137=0xa260E3732593E4EcF9DdC144fD6C4c5fe7077978,0xAb83653fd41511D638b69229afBf998Eb9B0F30c",
